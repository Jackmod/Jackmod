<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="340" viewBox="0 0 1200 340" fill="none" role="img" aria-label="xtsy — full-stack developer and UI designer, Seattle">
  <defs>
    <pattern id="grid" width="20" height="20" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.8" fill="#e3d9bf"/>
    </pattern>
    <clipPath id="card"><rect x="8" y="6" width="1176" height="316" rx="26"/></clipPath>
  </defs>

  <!-- hard sticker shadow -->
  <rect x="16" y="18" width="1176" height="316" rx="26" fill="#12100c"/>

  <g clip-path="url(#card)">
    <rect x="8" y="6" width="1176" height="316" fill="#fbf4e2"/>
    <rect x="8" y="6" width="1176" height="316" fill="url(#grid)"/>

    <!-- confetti stickers, drifting -->
    <g>
      <g transform="translate(956,74)">
        <circle r="46" fill="#ff3b30" stroke="#12100c" stroke-width="5"/>
        <text x="0" y="13" text-anchor="middle" font-family="'Archivo',Helvetica,Arial,sans-serif"
              font-size="40" font-weight="800" fill="#fbf4e2">&#123;&#125;</text>
        <animateTransform attributeName="transform" type="translate"
          values="0,0; 0,-14; 0,0" dur="5s" repeatCount="indefinite"
          calcMode="spline" keySplines="0.4 0 0.6 1;0.4 0 0.6 1" keyTimes="0;0.5;1" additive="sum"/>
      </g>

      <g transform="translate(1010,196) rotate(-8)">
        <rect x="-52" y="-30" width="104" height="60" rx="14" fill="#ffc400" stroke="#12100c" stroke-width="5"/>
        <text x="0" y="11" text-anchor="middle" font-family="ui-monospace,Menlo,Consolas,monospace"
              font-size="26" font-weight="700" fill="#12100c">&#60;/&#62;</text>
        <animateTransform attributeName="transform" type="rotate"
          values="0;5;0;-5;0" dur="7s" repeatCount="indefinite" additive="sum"/>
      </g>

      <g transform="translate(1112,72)">
        <path d="M0,-34 L9,-11 L33,-11 L14,4 L21,27 L0,13 L-21,27 L-14,4 L-33,-11 L-9,-11 Z"
              fill="#2f9bff" stroke="#12100c" stroke-width="5" stroke-linejoin="round"/>
        <animateTransform attributeName="transform" type="rotate"
          values="0;360" dur="22s" repeatCount="indefinite" additive="sum"/>
      </g>

      <g transform="translate(898,238)">
        <path d="M-46,0 q23,-26 46,0 t46,0" fill="none" stroke="#3ddc84" stroke-width="7" stroke-linecap="round"/>
        <animateTransform attributeName="transform" type="translate"
          values="0,0; 16,0; 0,0" dur="6s" repeatCount="indefinite"
          calcMode="spline" keySplines="0.4 0 0.6 1;0.4 0 0.6 1" keyTimes="0;0.5;1" additive="sum"/>
      </g>

      <g transform="translate(1120,246) rotate(12)">
        <rect x="-30" y="-30" width="60" height="60" rx="16" fill="#a855f7" stroke="#12100c" stroke-width="5"/>
        <animateTransform attributeName="transform" type="rotate"
          values="0;-10;0;10;0" dur="9s" repeatCount="indefinite" additive="sum"/>
      </g>
    </g>

    <!-- speech bubble -->
    <g transform="translate(596,100) rotate(-3)">
      <g>
        <rect x="6" y="8" width="268" height="58" rx="18" fill="#12100c"/>
        <rect x="0" y="0" width="268" height="58" rx="18" fill="#fbf4e2" stroke="#12100c" stroke-width="4.5"/>
        <path d="M34,56 l4,26 l24,-24 z" fill="#fbf4e2" stroke="#12100c" stroke-width="4.5" stroke-linejoin="round"/>
        <path d="M38,54 h22" stroke="#fbf4e2" stroke-width="6"/>
        <text x="134" y="36" text-anchor="middle" font-family="ui-monospace,'SF Mono',Menlo,Consolas,monospace"
              font-size="13.5" font-weight="700" letter-spacing="0.4" fill="#12100c">i make weird little tools</text>
        <animateTransform attributeName="transform" type="translate"
          values="0,0; 0,-9; 0,0" dur="4.4s" repeatCount="indefinite"
          calcMode="spline" keySplines="0.4 0 0.6 1;0.4 0 0.6 1" keyTimes="0;0.5;1" additive="sum"/>
      </g>
    </g>

    <!-- wordmark -->
    <text x="66" y="196" font-family="'Archivo','Helvetica Neue',Helvetica,Arial,sans-serif"
          font-size="152" font-weight="800" letter-spacing="-7" fill="#12100c">xtsy</text>
    <rect x="404" y="80" width="12" height="122" fill="#ff3b30">
      <animate attributeName="opacity" values="1;1;0;0;1" dur="1.2s" repeatCount="indefinite"/>
    </rect>

    <!-- highlighted role -->
    <rect x="62" y="216" width="470" height="34" rx="6" fill="#ffc400"/>
    <text x="76" y="240" font-family="ui-monospace,'SF Mono',Menlo,Consolas,monospace"
          font-size="16.5" font-weight="600" letter-spacing="2.6" fill="#12100c">FULL-STACK DEV &#183; UI DESIGNER</text>

    <!-- pills -->
    <g font-family="ui-monospace,'SF Mono',Menlo,Consolas,monospace" font-size="12.5" font-weight="600" letter-spacing="1.6">
      <g transform="translate(62,272)">
        <rect width="140" height="32" rx="16" fill="#2f9bff" stroke="#12100c" stroke-width="3.5"/>
        <text x="70" y="21" text-anchor="middle" fill="#fbf4e2">SEATTLE, WA</text>
      </g>
      <g transform="translate(214,272)">
        <rect width="86" height="32" rx="16" fill="#ff3b30" stroke="#12100c" stroke-width="3.5"/>
        <text x="43" y="21" text-anchor="middle" fill="#fbf4e2">AGE 17</text>
      </g>
      <g transform="translate(312,272)">
        <rect width="150" height="32" rx="16" fill="#3ddc84" stroke="#12100c" stroke-width="3.5"/>
        <text x="75" y="21" text-anchor="middle" fill="#12100c">SINCE 2021</text>
      </g>
      <g transform="translate(474,272)">
        <rect width="184" height="32" rx="16" fill="#12100c" stroke="#12100c" stroke-width="3.5"/>
        <circle cx="22" cy="16" r="5" fill="#3ddc84">
          <animate attributeName="opacity" values="1;0.15;1" dur="1.8s" repeatCount="indefinite"/>
        </circle>
        <text x="38" y="21" fill="#fbf4e2">OPEN TO WORK</text>
      </g>
    </g>
  </g>

  <rect x="8" y="6" width="1176" height="316" rx="26" fill="none" stroke="#12100c" stroke-width="5"/>
</svg>
