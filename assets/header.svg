<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="272" viewBox="0 0 1200 272" fill="none" role="img" aria-label="xtsy — full-stack developer and UI designer">
  <defs>
    <linearGradient id="sheen" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#6C8BFF" stop-opacity="0"/>
      <stop offset="30%" stop-color="#6C8BFF" stop-opacity="0.9"/>
      <stop offset="58%" stop-color="#35D6A4" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#35D6A4" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="glow" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#6C8BFF" stop-opacity="0.10"/>
      <stop offset="100%" stop-color="#6C8BFF" stop-opacity="0"/>
    </linearGradient>
    <pattern id="mesh" width="26" height="26" patternUnits="userSpaceOnUse">
      <path d="M26 0 L0 0 0 26" fill="none" stroke="#1B2027" stroke-width="1"/>
    </pattern>
    <clipPath id="hc"><rect x="1" y="1" width="1198" height="270" rx="18"/></clipPath>
  </defs>

  <g clip-path="url(#hc)">
    <rect x="1" y="1" width="1198" height="270" fill="#0B0D10"/>
    <rect x="1" y="1" width="1198" height="270" fill="url(#mesh)"/>
    <rect x="1" y="1" width="1198" height="150" fill="url(#glow)"/>
    <rect x="1" y="1" width="1198" height="2" fill="url(#sheen)"/>

    <text x="60" y="150" font-family="'Archivo','Helvetica Neue',Helvetica,Arial,sans-serif" font-size="118" font-weight="800" letter-spacing="-5.5" fill="#F3F5F4">xtsy</text>
    <rect x="318" y="66" width="7" height="94" fill="#6C8BFF">
      <animate attributeName="opacity" values="1;1;0;0;1" dur="1.4s" repeatCount="indefinite"/>
    </rect>

    <text x="64" y="188" font-family="ui-monospace,'SF Mono',Menlo,Consolas,monospace" font-size="14.5" font-weight="600" letter-spacing="4.6" fill="#8A939E">FULL-STACK DEVELOPER &#183; UI DESIGNER</text>

    <line x1="60" y1="216" x2="1140" y2="216" stroke="#272D36" stroke-width="1.5"/>

    <g font-family="ui-monospace,'SF Mono',Menlo,Consolas,monospace" font-size="12" letter-spacing="2.2" fill="#5A626C">
      <text x="60" y="244">SEATTLE, WA</text>
      <text x="212" y="244" fill="#2C333C">/</text>
      <text x="238" y="244">SHIPPING SINCE 2021</text>
      <text x="470" y="244" fill="#2C333C">/</text>
      <text x="496" y="244">AGE 17</text>
    </g>

    <g transform="translate(956,228)">
      <rect width="184" height="30" rx="15" fill="#1A1E25" stroke="#272D36" stroke-width="1.5"/>
      <circle cx="20" cy="15" r="4" fill="#35D6A4">
        <animate attributeName="opacity" values="1;0.2;1" dur="2.4s" repeatCount="indefinite"/>
      </circle>
      <text x="36" y="19.5" font-family="ui-monospace,'SF Mono',Menlo,Consolas,monospace" font-size="11" font-weight="600" letter-spacing="2" fill="#35D6A4">OPEN TO WORK</text>
    </g>

    <!-- lens profile: the bulge my portfolio bends its thumbnails through -->
    <g stroke-linecap="round" stroke-width="2" opacity="0.85">
      <line x1="820" y1="105" x2="820" y2="131" stroke="#232A33" opacity="0.55"/>
      <line x1="848" y1="92" x2="848" y2="144" stroke="#232A33" opacity="0.55"/>
      <line x1="876" y1="80" x2="876" y2="156" stroke="#232A33" opacity="0.55"/>
      <line x1="904" y1="70" x2="904" y2="166" stroke="#232A33" opacity="0.55"/>
      <line x1="932" y1="63" x2="932" y2="173" stroke="#2C3A46" opacity="0.55"/>
      <line x1="960" y1="59" x2="960" y2="177" stroke="#2C3A46" opacity="0.55"/>
      <line x1="988" y1="58" x2="988" y2="178" stroke="#6C8BFF" opacity="0.7"/>
      <line x1="1016" y1="59" x2="1016" y2="177" stroke="#6C8BFF" opacity="0.7"/>
      <line x1="1044" y1="63" x2="1044" y2="173" stroke="#2C3A46" opacity="0.55"/>
      <line x1="1072" y1="70" x2="1072" y2="166" stroke="#2C3A46" opacity="0.55"/>
      <line x1="1100" y1="80" x2="1100" y2="156" stroke="#2C3A46" opacity="0.55"/>
      <line x1="1128" y1="92" x2="1128" y2="144" stroke="#2C3A46" opacity="0.55"/>
    </g>
  </g>

  <rect x="1" y="1" width="1198" height="270" rx="18" fill="none" stroke="#272D36" stroke-width="1.5"/>
</svg>
