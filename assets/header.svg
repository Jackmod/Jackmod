<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="300" viewBox="0 0 1200 300" fill="none" role="img" aria-label="xtsy — I build interfaces where the interface is the product">
  <defs>
    <pattern id="dots" width="18" height="18" patternUnits="userSpaceOnUse">
      <circle cx="1.4" cy="1.4" r="1.4" fill="#15181c"/>
    </pattern>

    <!-- soft trailing glow for the scanline -->
    <linearGradient id="trail" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%"   stop-color="#c9f36d" stop-opacity="0"/>
      <stop offset="100%" stop-color="#c9f36d" stop-opacity="0.16"/>
    </linearGradient>

    <linearGradient id="topfade" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%"   stop-color="#ffffff" stop-opacity="0.045"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>

    <clipPath id="card"><rect width="1200" height="300" rx="16"/></clipPath>
  </defs>

  <g clip-path="url(#card)">
    <rect width="1200" height="300" fill="#0a0b0d"/>
    <rect width="1200" height="300" fill="url(#dots)"/>
    <rect width="1200" height="140" fill="url(#topfade)"/>

    <!-- scanline: a thin pass that sweeps, then rests. Nods to the scroll-warp
         lens on my site without washing out the type it travels behind. -->
    <g>
      <g>
        <rect x="-150" y="0" width="150" height="300" fill="url(#trail)"/>
        <rect x="0" y="0" width="2" height="300" fill="#dfff9b" opacity="0.5"/>
        <animateTransform attributeName="transform" type="translate"
          values="-40,0; 1290,0; 1290,0" keyTimes="0;0.45;1" dur="9s"
          repeatCount="indefinite" calcMode="spline" keySplines="0.5 0 0.2 1;0 0 1 1"/>
      </g>
    </g>

    <!-- lens profile: the same bulge my portfolio bends its thumbnails with,
         drawn as a bell of vertical rules -->
    <g stroke-linecap="round" stroke-width="2">
      <line x1="790"  y1="130" x2="790"  y2="170" stroke="#1b2127"/>
      <line x1="815"  y1="110" x2="815"  y2="190" stroke="#1e252b"/>
      <line x1="840"  y1="94"  x2="840"  y2="206" stroke="#222b30"/>
      <line x1="865"  y1="80"  x2="865"  y2="220" stroke="#273234"/>
      <line x1="890"  y1="69"  x2="890"  y2="231" stroke="#2d3b34"/>
      <line x1="915"  y1="61"  x2="915"  y2="239" stroke="#354731"/>
      <line x1="940"  y1="57"  x2="940"  y2="243" stroke="#3d552d"/>
      <line x1="965"  y1="55"  x2="965"  y2="245" stroke="#455f2a"/>
      <line x1="990"  y1="57"  x2="990"  y2="243" stroke="#3d552d"/>
      <line x1="1015" y1="61"  x2="1015" y2="239" stroke="#354731"/>
      <line x1="1040" y1="69"  x2="1040" y2="231" stroke="#2d3b34"/>
      <line x1="1065" y1="80"  x2="1065" y2="220" stroke="#273234"/>
      <line x1="1090" y1="94"  x2="1090" y2="206" stroke="#222b30"/>
      <line x1="1115" y1="110" x2="1115" y2="190" stroke="#1e252b"/>
      <line x1="1140" y1="130" x2="1140" y2="170" stroke="#1b2127"/>
    </g>

    <!-- wordmark -->
    <text x="62" y="178" font-family="'Archivo','Helvetica Neue',Helvetica,Arial,sans-serif"
          font-size="138" font-weight="800" letter-spacing="-6.5" fill="#f6f8f4">xtsy</text>
    <rect x="374" y="66" width="8" height="118" fill="#c9f36d">
      <animate attributeName="opacity" values="1;1;0;0;1" dur="1.5s" repeatCount="indefinite"/>
    </rect>

    <text x="66" y="221" font-family="ui-monospace,'SF Mono',Menlo,Consolas,monospace"
          font-size="16" letter-spacing="5.2" fill="#98a29b">FULL-STACK DEVELOPER &#183; UI DESIGNER</text>

    <line x1="62" y1="252" x2="1138" y2="252" stroke="#22272c" stroke-width="1"/>

    <g font-family="ui-monospace,'SF Mono',Menlo,Consolas,monospace" font-size="12.5" letter-spacing="2.4" fill="#767f79">
      <text x="62"  y="280">SEATTLE, WA</text>
      <text x="216" y="280" fill="#2f363b">/</text>
      <text x="240" y="280">SHIPPING SINCE 2021</text>
      <text x="466" y="280" fill="#2f363b">/</text>
      <text x="490" y="280">AGE 17</text>
    </g>

    <!-- status -->
    <g transform="translate(978,264)">
      <rect x="0" y="0" width="160" height="26" rx="13" fill="#151a13" stroke="#2c3a1d"/>
      <circle cx="17" cy="13" r="3.6" fill="#c9f36d">
        <animate attributeName="opacity" values="1;0.2;1" dur="2.4s" repeatCount="indefinite"/>
      </circle>
      <text x="31" y="17.5" font-family="ui-monospace,'SF Mono',Menlo,Consolas,monospace"
            font-size="11" letter-spacing="2" fill="#c9f36d">OPEN TO WORK</text>
    </g>

    <rect x="0.5" y="0.5" width="1199" height="299" rx="16" fill="none" stroke="#22272c"/>
  </g>
</svg>
