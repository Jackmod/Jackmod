<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="128" viewBox="0 0 1200 128" fill="none" role="img" aria-label="Language share by bytes: JavaScript 65.2%, CSS 16.2%, TypeScript 7.3%, C# 6.1%, Python 2.5%, HTML 2.5%, other 0.3%">
  <defs>
    <clipPath id="bar">
      <rect x="0" y="26" width="1200" height="20" rx="10"/>
    </clipPath>
  </defs>

  <text x="0" y="14" font-family="ui-monospace,'SF Mono',Menlo,Consolas,monospace"
        font-size="12" letter-spacing="3" fill="#6e7681">LANGUAGE SHARE · BY BYTES · 17 REPOSITORIES</text>

  <g clip-path="url(#bar)">
    <rect x="0"    y="26" width="782" height="20" fill="#f1e05a"/>
    <rect x="782"  y="26" width="194" height="20" fill="#663399"/>
    <rect x="976"  y="26" width="88"  height="20" fill="#3178c6"/>
    <rect x="1064" y="26" width="73"  height="20" fill="#178600"/>
    <rect x="1137" y="26" width="30"  height="20" fill="#3572A5"/>
    <rect x="1167" y="26" width="30"  height="20" fill="#e34c26"/>
    <rect x="1197" y="26" width="3"   height="20" fill="#6e7681"/>
    <rect x="-1200" y="26" width="1200" height="20" fill="#08090a" opacity="0.55">
      <animate attributeName="x" values="0;-1200" dur="1.1s" fill="freeze" calcMode="spline" keySplines="0.16 1 0.3 1" keyTimes="0;1"/>
    </rect>
  </g>

  <g font-family="ui-monospace,'SF Mono',Menlo,Consolas,monospace" font-size="12.5" fill="#8b9490">
    <circle cx="5"   cy="76" r="5" fill="#f1e05a"/><text x="18"  y="80">JavaScript 65.2%</text>
    <circle cx="185" cy="76" r="5" fill="#663399"/><text x="198" y="80">CSS 16.2%</text>
    <circle cx="315" cy="76" r="5" fill="#3178c6"/><text x="328" y="80">TypeScript 7.3%</text>
    <circle cx="480" cy="76" r="5" fill="#178600"/><text x="493" y="80">C# 6.1%</text>
    <circle cx="590" cy="76" r="5" fill="#3572A5"/><text x="603" y="80">Python 2.5%</text>
    <circle cx="725" cy="76" r="5" fill="#e34c26"/><text x="738" y="80">HTML 2.5%</text>
    <circle cx="855" cy="76" r="5" fill="#6e7681"/><text x="868" y="80">Rust · PowerShell · Shell · PLpgSQL 0.3%</text>
  </g>

  <text x="0" y="112" font-family="ui-monospace,'SF Mono',Menlo,Consolas,monospace"
