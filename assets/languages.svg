<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="176" viewBox="0 0 1200 176" fill="none" role="img" aria-label="Language share by bytes: JavaScript 65.2 percent, CSS 16.2, TypeScript 7.3, C sharp 6.1, Python 2.5, HTML 2.5, other 0.3">
  <defs>
    <pattern id="g2" width="20" height="20" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.8" fill="#e3d9bf"/>
    </pattern>
    <clipPath id="card2"><rect x="8" y="6" width="1176" height="152" rx="22"/></clipPath>
    <clipPath id="bar"><rect x="0" y="52" width="1116" height="30" rx="15"/></clipPath>
  </defs>

  <rect x="16" y="18" width="1176" height="152" rx="22" fill="#12100c"/>

  <g clip-path="url(#card2)">
    <rect x="8" y="6" width="1176" height="152" fill="#fbf4e2"/>
    <rect x="8" y="6" width="1176" height="152" fill="url(#g2)"/>

    <text x="42" y="40" font-family="ui-monospace,'SF Mono',Menlo,Consolas,monospace"
          font-size="12.5" font-weight="700" letter-spacing="2.6" fill="#12100c">WHAT THE BYTES SAY &#183; 17 REPOS</text>

    <g clip-path="url(#bar)" transform="translate(42,0)">
      <rect x="0"    y="52" width="728" height="30" fill="#f7df1e"/>
      <rect x="728"  y="52" width="181" height="30" fill="#a855f7"/>
      <rect x="909"  y="52" width="81"  height="30" fill="#2f9bff"/>
      <rect x="990"  y="52" width="68"  height="30" fill="#3ddc84"/>
      <rect x="1058" y="52" width="28"  height="30" fill="#4b8bbe"/>
      <rect x="1086" y="52" width="27"  height="30" fill="#ff3b30"/>
      <rect x="1113" y="52" width="3"   height="30" fill="#8a8578"/>
      <rect x="-1120" y="52" width="1120" height="30" fill="#fbf4e2">
        <animate attributeName="x" values="0;-1120" dur="1.3s" fill="freeze"
                 calcMode="spline" keySplines="0.16 1 0.3 1" keyTimes="0;1"/>
      </rect>
    </g>
    <rect x="42" y="52" width="1116" height="30" rx="15" fill="none" stroke="#12100c" stroke-width="4"/>

    <g font-family="ui-monospace,'SF Mono',Menlo,Consolas,monospace" font-size="13" font-weight="600" fill="#12100c">
      <rect x="42"  y="102" width="14" height="14" rx="4" fill="#f7df1e" stroke="#12100c" stroke-width="2.5"/>
      <text x="64"  y="114">JavaScript 65.2%</text>

      <rect x="238" y="102" width="14" height="14" rx="4" fill="#a855f7" stroke="#12100c" stroke-width="2.5"/>
      <text x="260" y="114">CSS 16.2%</text>

      <rect x="396" y="102" width="14" height="14" rx="4" fill="#2f9bff" stroke="#12100c" stroke-width="2.5"/>
      <text x="418" y="114">TypeScript 7.3%</text>

      <rect x="604" y="102" width="14" height="14" rx="4" fill="#3ddc84" stroke="#12100c" stroke-width="2.5"/>
      <text x="626" y="114">C# 6.1%</text>

      <rect x="740" y="102" width="14" height="14" rx="4" fill="#4b8bbe" stroke="#12100c" stroke-width="2.5"/>
      <text x="762" y="114">Python 2.5%</text>

      <rect x="906" y="102" width="14" height="14" rx="4" fill="#ff3b30" stroke="#12100c" stroke-width="2.5"/>
      <text x="928" y="114">HTML 2.5%</text>

      <rect x="1054" y="102" width="14" height="14" rx="4" fill="#8a8578" stroke="#12100c" stroke-width="2.5"/>
      <text x="1076" y="114">Rust +3</text>
    </g>

    <text x="42" y="142" font-family="ui-monospace,'SF Mono',Menlo,Consolas,monospace"
          font-size="11.5" fill="#6b6455">Bytes reward whoever ships the most files. Honest, not flattering — what I actually reach for is right below.</text>
  </g>

  <rect x="8" y="6" width="1176" height="152" rx="22" fill="none" stroke="#12100c" stroke-width="5"/>
</svg>
