<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="152" viewBox="0 0 1200 152" fill="none" role="img" aria-label="Language share by bytes across 17 repositories: JavaScript 65.2 percent, CSS 16.2, TypeScript 7.3, C sharp 6.1, Python 2.5, HTML 2.5, other 0.3">
  <defs>
    <clipPath id="bar"><rect x="0" y="34" width="1200" height="22" rx="11"/></clipPath>
    <clipPath id="card"><rect width="1200" height="152" rx="14"/></clipPath>
  </defs>

  <g clip-path="url(#card)">
    <rect width="1200" height="152" fill="#0a0b0d"/>

    <text x="26" y="24" font-family="ui-monospace,'SF Mono',Menlo,Consolas,monospace"
          font-size="12" letter-spacing="3.2" fill="#767f79">MEASURED &#183; BYTES ACROSS 17 REPOSITORIES</text>

    <g clip-path="url(#bar)" transform="translate(26,0)">
      <rect x="0"    y="34" width="748" height="22" fill="#f1e05a"/>
      <rect x="748"  y="34" width="186" height="22" fill="#8957e5"/>
      <rect x="934"  y="34" width="84"  height="22" fill="#3178c6"/>
      <rect x="1018" y="34" width="70"  height="22" fill="#2ea043"/>
      <rect x="1088" y="34" width="29"  height="22" fill="#4b8bbe"/>
      <rect x="1117" y="34" width="28"  height="22" fill="#e34c26"/>
      <rect x="1145" y="34" width="3"   height="22" fill="#6e7681"/>
      <rect x="-1150" y="34" width="1150" height="22" fill="#0a0b0d">
        <animate attributeName="x" values="0;-1150" dur="1.2s" fill="freeze"
                 calcMode="spline" keySplines="0.16 1 0.3 1" keyTimes="0;1"/>
      </rect>
    </g>

    <g font-family="ui-monospace,'SF Mono',Menlo,Consolas,monospace" font-size="13.5" fill="#b3bcb6">
      <circle cx="32"  cy="88" r="5.5" fill="#f1e05a"/><text x="47"  y="93">JavaScript</text>
      <text x="140" y="93" fill="#6e7681">65.2%</text>

      <circle cx="222" cy="88" r="5.5" fill="#8957e5"/><text x="237" y="93">CSS</text>
      <text x="285" y="93" fill="#6e7681">16.2%</text>

      <circle cx="367" cy="88" r="5.5" fill="#3178c6"/><text x="382" y="93">TypeScript</text>
      <text x="475" y="93" fill="#6e7681">7.3%</text>

      <circle cx="552" cy="88" r="5.5" fill="#2ea043"/><text x="567" y="93">C#</text>
      <text x="600" y="93" fill="#6e7681">6.1%</text>

      <circle cx="677" cy="88" r="5.5" fill="#4b8bbe"/><text x="692" y="93">Python</text>
      <text x="757" y="93" fill="#6e7681">2.5%</text>

      <circle cx="834" cy="88" r="5.5" fill="#e34c26"/><text x="849" y="93">HTML</text>
      <text x="903" y="93" fill="#6e7681">2.5%</text>

      <circle cx="980" cy="88" r="5.5" fill="#6e7681"/><text x="995" y="93" fill="#8b9490">Rust · Shell · SQL</text>
    </g>

    <line x1="26" y1="112" x2="1174" y2="112" stroke="#1b2025"/>

    <text x="26" y="136" font-family="ui-monospace,'SF Mono',Menlo,Consolas,monospace"
          font-size="11.5" fill="#5c6560">Bytes reward whatever ships the most files, so this is honest rather than flattering. What I actually reach for is below.</text>

    <rect x="0.5" y="0.5" width="1199" height="151" rx="14" fill="none" stroke="#22272c"/>
  </g>
</svg>
