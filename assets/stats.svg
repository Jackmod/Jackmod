    <!-- 4 -->
    <rect x="610" y="16" width="278" height="126" rx="20" fill="#12100c"/>
    <g clip-path="url(#s3)">
      <rect x="604" y="6" width="278" height="126" fill="#2f9bff"/>
      <circle cx="864" cy="24" r="42" fill="#ffffff" opacity="0.18"/>
    </g>
    <rect x="604" y="6" width="278" height="126" rx="20" fill="none" stroke="#12100c" stroke-width="5"/>
    <text x="630" y="82" font-size="54" font-weight="800" letter-spacing="-2" fill="#fbf4e2">4</text>
    <text x="630" y="110" font-family="ui-monospace,Menlo,Consolas,monospace" font-size="11.5"
