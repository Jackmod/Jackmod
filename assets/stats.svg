    <rect x="8" y="6" width="278" height="126" rx="20" fill="none" stroke="#12100c" stroke-width="5"/>
    <text x="34" y="82" font-size="54" font-weight="800" letter-spacing="-2" fill="#fbf4e2">700</text>
    <text x="34" y="110" font-family="ui-monospace,Menlo,Consolas,monospace" font-size="11.5"
          font-weight="600" letter-spacing="2" fill="#fbf4e2" opacity="0.9">CONTRIBUTIONS</text>

    <!-- 12 -->
    <rect x="312" y="16" width="278" height="126" rx="20" fill="#12100c"/>
    <g clip-path="url(#s2)">
      <rect x="306" y="6" width="278" height="126" fill="#ffc400"/>
      <circle cx="566" cy="24" r="42" fill="#ffffff" opacity="0.22"/>
    </g>
    <rect x="306" y="6" width="278" height="126" rx="20" fill="none" stroke="#12100c" stroke-width="5"/>
    <text x="332" y="82" font-size="54" font-weight="800" letter-spacing="-2" fill="#12100c">12</text>
    <text x="332" y="110" font-family="ui-monospace,Menlo,Consolas,monospace" font-size="11.5"
