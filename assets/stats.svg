<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="150" viewBox="0 0 1200 150" fill="none" role="img" aria-label="700 contributions, 12 public repos, 4 things you can actually use, shipping since 2021">
  <defs>
    <clipPath id="s1"><rect x="8" y="6" width="278" height="126" rx="20"/></clipPath>
    <clipPath id="s2"><rect x="306" y="6" width="278" height="126" rx="20"/></clipPath>
    <clipPath id="s3"><rect x="604" y="6" width="278" height="126" rx="20"/></clipPath>
    <clipPath id="s4"><rect x="902" y="6" width="278" height="126" rx="20"/></clipPath>
  </defs>

  <g font-family="'Archivo','Helvetica Neue',Helvetica,Arial,sans-serif">
