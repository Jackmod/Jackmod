<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="112" viewBox="0 0 1200 112" fill="none" role="img" aria-label="700 contributions, 12 public repositories, 4 live products, shipping since 2021">
  <defs>
    <pattern id="d2" width="18" height="18" patternUnits="userSpaceOnUse">
      <circle cx="1.4" cy="1.4" r="1.4" fill="#14171b"/>
    </pattern>
    <clipPath id="c2"><rect width="1200" height="112" rx="14"/></clipPath>
  </defs>

  <g clip-path="url(#c2)">
    <rect width="1200" height="112" fill="#0a0b0d"/>
    <rect width="1200" height="112" fill="url(#d2)"/>

    <g font-family="'Archivo','Helvetica Neue',Helvetica,Arial,sans-serif" font-size="42" font-weight="800" letter-spacing="-1.6" fill="#f6f8f4">
      <text x="60"  y="58">700</text>
      <text x="360" y="58">12</text>
      <text x="660" y="58">4</text>
      <text x="960" y="58">2021</text>
    </g>

    <g font-family="ui-monospace,'SF Mono',Menlo,Consolas,monospace" font-size="11.5" letter-spacing="2.6" fill="#767f79">
      <text x="62"  y="82">CONTRIBUTIONS</text>
      <text x="362" y="82">PUBLIC REPOS</text>
      <text x="662" y="82">LIVE PRODUCTS</text>
      <text x="962" y="82">SHIPPING SINCE</text>
    </g>

    <g stroke="#1e2429">
      <line x1="320" y1="30" x2="320" y2="82"/>
      <line x1="620" y1="30" x2="620" y2="82"/>
      <line x1="920" y1="30" x2="920" y2="82"/>
    </g>

    <rect x="60" y="94" width="0" height="2" rx="1" fill="#c9f36d">
      <animate attributeName="width" values="0;180" dur="1.1s" fill="freeze"
               calcMode="spline" keySplines="0.16 1 0.3 1" keyTimes="0;1"/>
    </rect>

    <rect x="0.5" y="0.5" width="1199" height="111" rx="14" fill="none" stroke="#22272c"/>
  </g>
</svg>
