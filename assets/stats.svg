    <rect x="14" y="16" width="278" height="126" rx="20" fill="#12100c"/>
    <g clip-path="url(#s1)">
      <rect x="8" y="6" width="278" height="126" fill="#ff3b30"/>
      <circle cx="268" cy="24" r="42" fill="#ffffff" opacity="0.13"/>
