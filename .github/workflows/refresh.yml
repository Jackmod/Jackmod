name: Refresh live cards

# The heatmap and the metric tiles are committed SVGs, so without this they
# freeze on whatever day they were last built. This redraws them from the API
# each morning and commits only when the pixels actually changed.

on:
  schedule:
    # 07:12 UTC. Off the hour on purpose — the top of the hour is when every
    # scheduled workflow on GitHub fires at once and the queue backs up.
    - cron: '12 7 * * *'
  workflow_dispatch:
  push:
    branches: [master]
    paths:
      - 'refresh.mjs'
      - 'lib.mjs'
      - '.github/workflows/refresh.yml'

permissions:
  contents: write

concurrency:
  group: refresh-cards
  cancel-in-progress: true

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Redraw heatmap and metrics
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node refresh.mjs

      - name: Commit if anything moved
        run: |
          git config user.name  'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add assets/heatmap.svg assets/stats.svg assets/activity.svg
          # --quiet exits non-zero when there is something staged, so an
          # unchanged day is a clean no-op rather than an empty commit.
          if git diff --staged --quiet; then
            echo 'No change today.'
          else
            git commit -m 'Refresh contribution heatmap and metrics'
            git push
          fi
